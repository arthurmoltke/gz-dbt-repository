version: 2

sources:
  - name: raw
    schema: gz_raw_data 
    tables:
      - name: sales 
        identifier: raw_gz_sales
        descriptions: sales of greenweez
        columns: 
          - name: date_date 
            description: date of purchase
          - name: orders_id
            description: the identification of the purchase 
          - name: pdt_id
            description: the identification of the sold product
          - name: revenue 
            description: the amount of income generated 
          - name: quantity
            description: the amount of products sold per order 
        tests:
          - unique: 
              column_name: "(orders_id || '-' || pdt_id)" 
          - not_null:
              column_name: "(orders_id || '-' || pdt_id)"    
      - name: product
        identifier: raw_gz_product
        description: products of greenweez
        columns:
          - name: products_id 
            description: the identification of the sold product
            tests:
              - not_null
              - unique
      - name: ship
        identifier: raw_gz_ship 
        description: shipping of the products of greenweez
        columns: 
          - name: orders_id 
            description: the identification of the purchase 
            tests:
              - not_null
              - unique